name: Windows Core regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [win-msvc-debug, win-msvc-release]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure, build, and test policies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'MSVC installation not found.' }
          Import-Module "$installation/Common7/Tools/Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Set-Location $env:GITHUB_WORKSPACE
          ./tools/Bootstrap-Windows.ps1
          cmake --preset ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed.' }
          cmake --build --preset ${{ matrix.preset }}
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          ctest --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'CTest failed.' }
      - name: Upload build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.preset }}
          path: |
            out/build/${{ matrix.preset }}/AetherWall.Core.exe
            out/build/${{ matrix.preset }}/AetherWall.SceneCheck.exe
            out/build/${{ matrix.preset }}/licenses/
            out/build/${{ matrix.preset }}/Testing/Temporary/
            out/build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
