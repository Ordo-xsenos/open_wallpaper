services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: aetherwall
      POSTGRES_DB: aetherwall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your ignored .env}
    volumes:
      - metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetherwall"]
      interval: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    ports: ["127.0.0.1:8765:8765"]
    volumes: ["objects:/data"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  metadata:
  objects:
